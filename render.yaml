# Render.com Blueprint – "New → Blueprint" und dieses Repository auswählen.
services:
  - type: web
    name: planner
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
